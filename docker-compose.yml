version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fleetmind-postgres
    restart: always
    environment:
      POSTGRES_USER: fleetuser
      POSTGRES_PASSWORD: fleetpassword123
      POSTGRES_DB: fleetmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetuser -d fleetmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: fleetmind-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://fleetuser:fleetpassword123@postgres:5432/fleetmind_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - JWT_SECRET_KEY=fleetmind-super-secret-key-change-in-production
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
